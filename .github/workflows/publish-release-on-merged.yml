name: Publish Release on Merged

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    uses: Infomaniak/.github/.github/workflows/kmp-publish-on-release-merge.yml@v2
    with:
      merged: ${{ github.event.pull_request.merged }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      merge-commit-sha: ${{ github.event.pull_request.merge_commit_sha }}
      rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      clean-paths: CalendarKmpDav/rust/caldav_bridge/target
      lib-name: "Calendar lib"
      spm-line: |
        .package(url: "https://github.com/Infomaniak/multiplatform-calendar", from: "{VERSION}")
      android-line: |
        implementation("com.infomaniak.multiplatform_calendar:CalendarCore:{VERSION}")
      maven-group-path: "com/infomaniak/multiplatform_calendar"
    secrets:
      REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
      REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
      KCHAT_KMP_WEBHOOK_URL: ${{ secrets.KCHAT_KMP_WEBHOOK_URL }}
