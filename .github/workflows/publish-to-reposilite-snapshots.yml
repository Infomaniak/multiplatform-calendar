# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: Publish to Reposilite Snapshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Snapshot version to publish (e.g. 0.1.0)'
        required: true
        type: string
      perform-a-gradle-clean:
        description: "Perform a Gradle clean"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: 'Snapshot version to publish (e.g. 0.1.0)'
        required: true
        type: string
      commit-sha:
        description: 'Commit SHA the snapshot is built from (defaults to the triggering ref if omitted)'
        required: false
        type: string
    secrets:
      REPOSILITE_USERNAME:
        required: true
      REPOSILITE_PASSWORD:
        required: true
      GPG_KEY_ID:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PRIVATE_PASSWORD:
        required: true
      KCHAT_KMP_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  publish:
    uses: Infomaniak/.github/.github/workflows/kmp-publish-reposilite-snapshot.yml@v2
    with:
      version: ${{ inputs.version }}
      commit-sha: ${{ inputs.commit-sha }}
      perform-a-gradle-clean: ${{ inputs.perform-a-gradle-clean }}
      rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      clean-paths: CalendarKmpDav/rust/caldav_bridge/target
      lib-name: "Android Calendar"
      artifact-line: 'implementation("com.infomaniak.multiplatform_calendar:CalendarCore:{VERSION}")'
      maven-group-path: "com/infomaniak/multiplatform_calendar"
    secrets:
      REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
      REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
      KCHAT_KMP_WEBHOOK_URL: ${{ secrets.KCHAT_KMP_WEBHOOK_URL }}
