# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: Publish to Reposilite

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.x.x)'
        required: true
        type: string
      acknowledgement:
        description: |
          WARNING: Publishing a version to Reposilite is irrevocable.
          Do you confirm (Yes/no):
          1. You have successfully tested publishing snapshot (with a Gradle CLEAN) just before changing the version
          2. The version is CORRECT, and is NOT a SNAPSHOT
          3. The iOS release has already been published
          4. You are pointing this workflow run to the tag that matches the version
          5. You are not drunk or otherwise too tired
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to release (x.x.x)'
        required: true
        type: string
    secrets:
      REPOSILITE_USERNAME:
        required: true
      REPOSILITE_PASSWORD:
        required: true
      GPG_KEY_ID:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PRIVATE_PASSWORD:
        required: true

permissions: {}

jobs:
  check-acknowledgement:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check acknowledgement
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
        run: test "$ACKNOWLEDGEMENT" = "Yes" || (echo "Acknowledgement missing" && exit 1)
      # Guard against publishing a "release" that's actually a snapshot (e.g. "1.2.3-SNAPSHOT"):
      # PublishPlugin would silently route it to the snapshots repository instead of failing.
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Version '$VERSION' is not a valid release version (expected x.x.x, e.g. 1.2.3)"
            exit 1
          }

  publish:
    needs: check-acknowledgement
    if: always() && (needs.check-acknowledgement.result == 'success' || needs.check-acknowledgement.result == 'skipped')
    uses: Infomaniak/.github/.github/workflows/kmp-publish-reposilite-release.yml@v2
    with:
      version: ${{ inputs.version }}
      rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      clean-paths: CalendarKmpDav/rust/caldav_bridge/target
    secrets:
      REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
      REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
