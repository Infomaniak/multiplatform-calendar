# Raise the link deployment target for the Apple iOS triples.
#
# rustc still defaults `aarch64-apple-ios` to iOS 10.0 (`rustc --print deployment-target
# --target aarch64-apple-ios` → 10.0) and passes `-target arm64-apple-ios10.0.0` to the linker,
# while the `cc` crate compiles C sources at the SDK default (iOS 16 under Xcode 26). Any C code
# with large stack frames then emits calls to `___chkstk_darwin`, a libSystem helper that only
# exists from iOS 12 onwards, so the link fails with an undefined symbol.
#
# This affects *every* C-building crate in the graph, not one in particular: `aws-lc-sys` (via
# fast-dav-rs → hyper-rustls → rustls) fails first, and removing it just moves the failure to
# `zstd-sys` (via fast-dav-rs → async-compression). Swapping the rustls crypto provider is
# therefore not a fix — raising the link deployment target is.
#
# Scoped per target on purpose: the equivalent `[env] IPHONEOS_DEPLOYMENT_TARGET` would apply to
# every cargo invocation, including the macOS host build of aws-lc-sys' memcmp probe, which then
# builds a binary it cannot execute and panics.
#
# The value is the package minimum declared in `Package.swift` (`.iOS(.v14)`), which is well above
# the iOS 12 that `___chkstk_darwin` requires. Do not raise it above that minimum: it would encode
# a stricter deployment target in the native code than the one the package advertises to consumers.
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=arm64-apple-ios14.0"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=arm64-apple-ios14.0-simulator"]
