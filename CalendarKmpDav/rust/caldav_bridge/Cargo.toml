[package]
name = "caldav_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
fast-dav-rs = "0.7.0"
hyper-util = "0.1"
bytes = "1"
http = "1"
uuid = { version = "1", features = ["v4"] }
uniffi = { version = "0.32.0", features = ["tokio"] }
thiserror = "2"
icalendar = { version = "0.17.10", features = ["parser"] }
roxmltree = "0.21"

[profile.release]
lto = true
opt-level = "s"
# Strip everything: the bindings are generated from a separate host library built by
# `buildLibraryForBindings`, so the shipped per-target artifacts don't need their symbol table.
strip = true
