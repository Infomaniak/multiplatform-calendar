kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# The Ubique UniFFI plugin generates its bindings into the shared `nativeMain` source set,
# which references the cinterop declarations. Those are only visible from a shared source set
# once the commonizer has run, so cinterop commonization must be enabled.
kotlin.mpp.enableCInteropCommonization=true
#Gradle
org.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options\="-Xmx6g" -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Rust
# Compile the Rust crate with Cargo's `release` profile. A debug build weighs ~77 MB per Android
# ABI (vs ~6 MB in release), which would bloat every consumer. Override with
# `-PreleaseBuild=false` for a faster local Rust build when iterating on the crate itself.
releaseBuild=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
kmp.compileSdk=37
kmp.minSdk=27
