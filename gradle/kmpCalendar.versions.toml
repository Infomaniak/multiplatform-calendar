[versions]
# Keep this version synced with Core's agp version
agp = "9.3.2"
compose = "1.12.1"
coroutines = "1.11.0"
coreKtx = "1.7.0"
# Ktor 3.6+ pulls in 0.8.0-0.6.x-compat (via ktor-openapi-schema), which Gradle ranks above 0.8.0.
# Pin the same version so export(kotlinx.datetime) matches the resolved one, otherwise the iOS framework link fails.
datetime = "0.8.0-0.6.x-compat"
kotlin = "2.4.20"
ksp = "2.3.11"
ktor = "3.6.0"
materialKolor = "5.0.1"
metro = "1.4.2" # See https://github.com/ZacSweers/metro/blob/main/docs/compatibility.md.
room3 = "3.0.3"
skie = "0.10.15"
serialization = "1.11.0"
sqlite = "2.7.1"
robolectric = "4.16.1"
# Rust
ubiqueUniffi = "1.3.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-content-negociation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
material-kolor = { module = "com.materialkolor:material-color-utilities", version.ref = "materialKolor" }
#Test
android-test = { module = "androidx.test:core-ktx", version.ref = "coreKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidx-room = { id = "androidx.room3", version.ref = "room3" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
ensureNdkVersion = { id = "ensure-ndk-version" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
publish = { id = "infomaniak.publishPlugin" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
# Rust
ubique-uniffi = { id = "ch.ubique.uniffi.plugin", version.ref = "ubiqueUniffi" }


[bundles]
ktor = [
    "ktor-client-content-negociation",
    "ktor-client-core",
    "ktor-client-encoding",
    "ktor-client-json",
]
